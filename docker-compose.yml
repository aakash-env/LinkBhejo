version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: linkbhejo-postgres
    environment:
      POSTGRES_USER: linkbhejo
      POSTGRES_PASSWORD: linkbhejo_dev_password
      POSTGRES_DB: linkbhejo
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkbhejo"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: linkbhejo-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
