name: Deploy to AWS

on:
  push:
    branches: [main]

# Top-level env cannot use secrets — only non-secret values here
env:
  AWS_REGION: us-east-1
  ECS_CLUSTER: linkbhejo-prod

jobs:
  # ─── Run CI first — never deploy broken code ──────────────────────────────
  ci:
    name: Lint, Type-check & Test
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Build, Push & Deploy
    runs-on: ubuntu-latest
    needs: [ci]   # <── only runs if CI passes
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # ECR registry built at step level so the secret is available
      - name: Set ECR registry
        id: ecr
        run: echo "registry=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com" >> $GITHUB_OUTPUT

      # ─── Build & Push: Web ──────────────────────────────────────────────────
      - name: Build and push web image
        id: build-web
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $REGISTRY/linkbhejo/web:$IMAGE_TAG \
            -t $REGISTRY/linkbhejo/web:latest \
            -f apps/web/Dockerfile \
            .
          docker push $REGISTRY/linkbhejo/web:$IMAGE_TAG
          docker push $REGISTRY/linkbhejo/web:latest
          echo "image=$REGISTRY/linkbhejo/web:$IMAGE_TAG" >> $GITHUB_OUTPUT

      # ─── Build & Push: API ──────────────────────────────────────────────────
      - name: Build and push api image
        id: build-api
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $REGISTRY/linkbhejo/api:$IMAGE_TAG \
            -t $REGISTRY/linkbhejo/api:latest \
            -f apps/api/Dockerfile \
            .
          docker push $REGISTRY/linkbhejo/api:$IMAGE_TAG
          docker push $REGISTRY/linkbhejo/api:latest
          echo "image=$REGISTRY/linkbhejo/api:$IMAGE_TAG" >> $GITHUB_OUTPUT

      # ─── Build & Push: Worker ───────────────────────────────────────────────
      - name: Build and push worker image
        id: build-worker
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $REGISTRY/linkbhejo/worker:$IMAGE_TAG \
            -t $REGISTRY/linkbhejo/worker:latest \
            -f apps/api/Dockerfile.worker \
            .
          docker push $REGISTRY/linkbhejo/worker:$IMAGE_TAG
          docker push $REGISTRY/linkbhejo/worker:latest
          echo "image=$REGISTRY/linkbhejo/worker:$IMAGE_TAG" >> $GITHUB_OUTPUT

      # ─── Run DB Migrations ──────────────────────────────────────────────────
      # Correct pattern: run-task → capture ARN → wait tasks-stopped → check exit code
      - name: Run database migrations via ECS task
        run: |
          TASK_ARN=$(aws ecs run-task \
            --cluster $ECS_CLUSTER \
            --task-definition linkbhejo-migrate \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ secrets.PRIVATE_SUBNET_IDS }}],securityGroups=[${{ secrets.ECS_SECURITY_GROUP_ID }}],assignPublicIp=DISABLED}" \
            --overrides '{"containerOverrides":[{"name":"migrate","command":["node","node_modules/.bin/prisma","migrate","deploy"]}]}' \
            --query 'tasks[0].taskArn' \
            --output text)

          echo "Migration task ARN: $TASK_ARN"

          # Wait for the task to finish (up to 10 minutes)
          aws ecs wait tasks-stopped \
            --cluster $ECS_CLUSTER \
            --tasks "$TASK_ARN"

          # Check the exit code — fail the deploy if migration failed
          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster $ECS_CLUSTER \
            --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)

          if [ "$EXIT_CODE" != "0" ]; then
            echo "❌ Migration failed with exit code $EXIT_CODE"
            exit 1
          fi
          echo "✅ Migrations completed successfully"

      # ─── Update Task Definitions with new image tags ────────────────────────
      # force-new-deployment alone reuses the OLD image — must update task def first
      - name: Update web task definition with new image
        id: web-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: infra/ecs/web-task.json
          container-name: web
          image: ${{ steps.build-web.outputs.image }}

      - name: Update api task definition with new image
        id: api-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: infra/ecs/api-task.json
          container-name: api
          image: ${{ steps.build-api.outputs.image }}

      - name: Update worker task definition with new image
        id: worker-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: infra/ecs/worker-task.json
          container-name: worker
          image: ${{ steps.build-worker.outputs.image }}

      # ─── Deploy updated task definitions to ECS ─────────────────────────────
      - name: Deploy web to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.web-task-def.outputs.task-definition }}
          service: linkbhejo-web
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Deploy api to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.api-task-def.outputs.task-definition }}
          service: linkbhejo-api
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Deploy worker to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.worker-task-def.outputs.task-definition }}
          service: linkbhejo-worker
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Deployment complete
        run: |
          echo "✅ LinkBhejo deployed to production!"
          echo "Commit: ${{ github.sha }}"
          echo "Web image: ${{ steps.build-web.outputs.image }}"
          echo "API image: ${{ steps.build-api.outputs.image }}"
