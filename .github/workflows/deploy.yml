name: Deploy to AWS

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-1
  ECS_CLUSTER: linkbhejo-prod

jobs:
  # ─── CI must pass before any deploy ────────────────────────────────────────
  ci:
    name: Lint, Type-check & Test
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Build, Push & Deploy
    runs-on: ubuntu-latest
    needs: [ci]
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ─── AWS Auth ────────────────────────────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ecr-login outputs: registry = "123456789.dkr.ecr.us-east-1.amazonaws.com"
      # Use steps.ecr-login.outputs.registry — no custom step needed
      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # Ensure ECR repos exist — idempotent, safe to run every deploy
      - name: Create ECR repositories if not exists
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          for repo in linkbhejo/web linkbhejo/api linkbhejo/worker; do
            aws ecr describe-repositories --repository-names "$repo" 2>/dev/null || \
            aws ecr create-repository --repository-name "$repo" \
              --image-scanning-configuration scanOnPush=true \
              --encryption-configuration encryptionType=AES256
            echo "✅ Repo ready: $repo"
          done

      # ─── Build & Push: Web ───────────────────────────────────────────────────
      - name: Build and push web image
        id: build-web
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $REGISTRY/linkbhejo/web:$IMAGE_TAG \
            -t $REGISTRY/linkbhejo/web:latest \
            -f apps/web/Dockerfile \
            .
          docker push $REGISTRY/linkbhejo/web:$IMAGE_TAG
          docker push $REGISTRY/linkbhejo/web:latest
          echo "image=$REGISTRY/linkbhejo/web:$IMAGE_TAG" >> $GITHUB_OUTPUT

      # ─── Build & Push: API ───────────────────────────────────────────────────
      - name: Build and push api image
        id: build-api
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $REGISTRY/linkbhejo/api:$IMAGE_TAG \
            -t $REGISTRY/linkbhejo/api:latest \
            -f apps/api/Dockerfile \
            .
          docker push $REGISTRY/linkbhejo/api:$IMAGE_TAG
          docker push $REGISTRY/linkbhejo/api:latest
          echo "image=$REGISTRY/linkbhejo/api:$IMAGE_TAG" >> $GITHUB_OUTPUT

      # ─── Build & Push: Worker ────────────────────────────────────────────────
      - name: Build and push worker image
        id: build-worker
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $REGISTRY/linkbhejo/worker:$IMAGE_TAG \
            -t $REGISTRY/linkbhejo/worker:latest \
            -f apps/api/Dockerfile.worker \
            .
          docker push $REGISTRY/linkbhejo/worker:$IMAGE_TAG
          docker push $REGISTRY/linkbhejo/worker:latest
          echo "image=$REGISTRY/linkbhejo/worker:$IMAGE_TAG" >> $GITHUB_OUTPUT

      # ─── DB Migrations ───────────────────────────────────────────────────────
      # run-task → capture ARN → wait tasks-stopped → assert exit code = 0
      - name: Run database migrations
        run: |
          TASK_ARN=$(aws ecs run-task \
            --cluster $ECS_CLUSTER \
            --task-definition linkbhejo-migrate \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ secrets.PRIVATE_SUBNET_IDS }}],securityGroups=[${{ secrets.ECS_SECURITY_GROUP_ID }}],assignPublicIp=DISABLED}" \
            --overrides '{"containerOverrides":[{"name":"migrate","command":["node","node_modules/.bin/prisma","migrate","deploy"]}]}' \
            --query 'tasks[0].taskArn' \
            --output text)

          echo "Migration task: $TASK_ARN"

          aws ecs wait tasks-stopped \
            --cluster $ECS_CLUSTER \
            --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster $ECS_CLUSTER \
            --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)

          if [ "$EXIT_CODE" != "0" ]; then
            echo "❌ Migration failed (exit $EXIT_CODE)"
            exit 1
          fi
          echo "✅ Migrations done"

      # ─── Update task definitions with new image tags ──────────────────────────
      - name: Render web task definition
        id: web-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: infra/ecs/web-task.json
          container-name: web
          image: ${{ steps.build-web.outputs.image }}

      - name: Render api task definition
        id: api-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: infra/ecs/api-task.json
          container-name: api
          image: ${{ steps.build-api.outputs.image }}

      - name: Render worker task definition
        id: worker-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: infra/ecs/worker-task.json
          container-name: worker
          image: ${{ steps.build-worker.outputs.image }}

      # ─── Deploy to ECS (registers new task def revision + updates service) ───
      - name: Deploy web
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.web-task-def.outputs.task-definition }}
          service: linkbhejo-web
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Deploy api
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.api-task-def.outputs.task-definition }}
          service: linkbhejo-api
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Deploy worker
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.worker-task-def.outputs.task-definition }}
          service: linkbhejo-worker
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Done
        run: |
          echo "✅ Deployed commit ${{ github.sha }}"
          echo "Web:    ${{ steps.build-web.outputs.image }}"
          echo "API:    ${{ steps.build-api.outputs.image }}"
          echo "Worker: ${{ steps.build-worker.outputs.image }}"
